# .deb / .rpm package definition for nfpm (https://nfpm.goreleaser.com).
# Used by .github/workflows/release.yml; NEPLANG_VERSION and NFPM_ARCH (amd64 | arm64)
# come from the environment; the workflow copies the binary to package/neplang first
# (nfpm doesn't expand environment variables in contents paths).
name: neplang
arch: ${NFPM_ARCH}
platform: linux
version: ${NEPLANG_VERSION}
section: interpreters
priority: optional
maintainer: Charitra Shrestha <stharabi9862187405@gmail.com>
description: |
  Programming language with romanized Nepali keywords.
  NepLang mixes romanized Nepali control-flow words (vana, yedi, natara,
  jabasamma, ko_lagi, kaam, farkau) with English technical terms.
homepage: https://github.com/charitraa/NepLang
license: MIT

contents:
  - src: package/neplang
    dst: /usr/bin/neplang
    file_info:
      mode: 0755
  - src: docs/neplang.1
    dst: /usr/share/man/man1/neplang.1
    file_info:
      mode: 0644
  - src: LICENSE
    dst: /usr/share/doc/neplang/copyright
    file_info:
      mode: 0644
  - src: examples/
    dst: /usr/share/doc/neplang/examples/
    type: tree
