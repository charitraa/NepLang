<script>
(function () {
  // The guide is the README's language sections, so the website and README never disagree.
  const FROM = '## Running programs';
  const UNTIL = '## Editor support';
  const doc = document.getElementById('doc');
  const toc = document.getElementById('toc');

  const slug = (t) => t.toLowerCase().replace(/[`'"]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  const isNepLang = (code) => /\b(vana|kaam|yedi|jabasamma|ko_lagi|class|import|farkau|interface)\b/.test(code) || /^\s*[A-Za-z_]\w*\s*=\s*\S/m.test(code);

  function local() { return fetch('README.md').then((r) => { if (!r.ok) throw 0; return r.text(); }); }
  function remote() { return fetch('https://raw.githubusercontent.com/charitraa/NepLang/main/README.md').then((r) => r.text()); }

  local().catch(remote).then((md) => {
    const a = md.indexOf(FROM), b = md.indexOf(UNTIL);
    const part = md.slice(a < 0 ? 0 : a, b < 0 ? undefined : b);
    doc.innerHTML = '<h1>Documentation</h1>' + marked.parse(part);

    // headings get ids and a table of contents
    const ul = document.createElement('ul');
    doc.querySelectorAll('h2, h3').forEach((h) => {
      h.id = slug(h.textContent);
      const li = document.createElement('li');
      if (h.tagName === 'H3') li.className = 'sub';
      const link = document.createElement('a');
      link.href = '#' + h.id;
      link.textContent = h.textContent;
      li.appendChild(link);
      ul.appendChild(li);
    });
    toc.appendChild(ul);

    // links inside the README that point at repo files go to GitHub
    doc.querySelectorAll('a[href]').forEach((link) => {
      const href = link.getAttribute('href');
      if (href.startsWith('#')) link.setAttribute('href', '#' + slug(href.slice(1)));
      else if (!/^[a-z]+:/.test(href)) link.href = 'https://github.com/charitraa/NepLang/blob/main/' + href;
    });

    // NepLang code blocks: highlighted, with a Try button that opens the playground
    doc.querySelectorAll('pre > code').forEach((code) => {
      if (/language-/.test(code.className)) return;   // bash, powershell, ...
      const text = code.textContent;
      const transcript = /^(\$ |> )/m.test(text) || /^Error in /m.test(text);
      if (!isNepLang(text) && !transcript) return;
      code.innerHTML = NepLang.highlight(text);
      if (transcript || !isNepLang(text)) return;
      const btn = document.createElement('a');
      btn.className = 'try-btn';
      btn.href = 'playground.html#code=' + NepLang.encodeCode(text.replace(/\n$/, ''));
      btn.textContent = 'Try it';
      btn.setAttribute('aria-label', 'Try this example in the playground');
      code.parentElement.appendChild(btn);
    });

    if (location.hash) {
      const target = document.getElementById(location.hash.slice(1));
      if (target) target.scrollIntoView();
    }
  }).catch(() => {
    doc.innerHTML = '<h1>Documentation</h1><p>The guide could not be loaded. Read it on <a href="https://github.com/charitraa/NepLang#readme">GitHub</a>.</p>';
  });
})();
</script>
