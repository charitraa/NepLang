# Builds the NepLang website (website/) with the interpreter compiled to WebAssembly and
# publishes it to GitHub Pages. One-time setup: Settings -> Pages -> Source: GitHub Actions.
name: website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "src/**"
      - "examples/**"
      - "README.md"
      - "Makefile"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.74

      - name: Build the playground interpreter (WebAssembly)
        run: make wasm

      - name: Add the examples and the README (the docs page renders it)
        run: |
          mkdir -p website/examples
          cp examples/*.np website/examples/
          cp README.md website/README.md

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
